# Publishes the game to GitHub Pages on every push to the default branch,
# together with the Android app: apk/heelstomp.apk and apk/version.json (read
# by the app's update check).
# One-time setup in the repository: Settings -> Pages -> Build and deployment
# -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never cancel a deployment that is already running
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  apk:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the Android app
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_UPDATE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apk/
        # one retry: the build tools' downloads sometimes hit rate limits
        run: tools/build_apk.sh || { sleep 60; tools/build_apk.sh; }
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/apk/
          retention-days: 30

  build:
    needs: apk
    # the web game still goes out if the app build failed
    if: ${{ !cancelled() && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (runtime files only)
        run: tools/build_site.sh _site
      - name: Add the Android app
        id: apk
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk
          path: _site/apk
      # the app build failed: keep the app that is online now, so the
      # download link keeps working
      - name: Keep the previous Android app
        if: steps.apk.outcome != 'success'
        run: |
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/apk"
          mkdir -p _site/apk
          curl -fsSL -o _site/apk/version.json "$site/version.json" && curl -fsSL -o _site/apk/heelstomp.apk "$site/heelstomp.apk" || rm -rf _site/apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
