# Manual check of the Android app on emulators (Actions tab -> "Android app
# check" -> Run workflow): installs the app, plays a little through adb and
# reports what the page did (tools/android_check.py). The report, screenshots
# and the app's log are attached to the run.
name: Android app check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the app (page inspectable over adb)
        env:
          APK_WEB_DEBUG: 'true'
        run: tools/build_apk.sh || { sleep 60; tools/build_apk.sh; }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install websocket-client pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: python tools/android_check.py --out android-check-${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-${{ matrix.api }}
          path: android-check-${{ matrix.api }}/
